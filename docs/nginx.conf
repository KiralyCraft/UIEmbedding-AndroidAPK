# Include these zones in the http {} context.
limit_req_zone $binary_remote_addr zone=collector_login:10m rate=6r/m;

# Example dedicated hostname. TLS certificate directives belong in your existing config.
server {
    listen 443 ssl;
    server_name embeddings.example.org;
    # ssl_certificate ...;
    # ssl_certificate_key ...;
    client_max_body_size 2m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /v1/auth/login {
        limit_req zone=collector_login burst=6 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
# For a path prefix, strip it in the proxy, e.g. location /embeddings/ {
#   proxy_pass http://127.0.0.1:8000/;
#   ...same headers...
# }
# Enter https://host/embeddings/ in the Android app. It preserves this prefix.
